<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Top Down Shooter</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>Top Down Shooter (HTML5)</h1>
        <p>WASD to Move, Mouse to Aim, Click to Shoot</p>
        <h2 id="score">Score: 0</h2>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        // 设置 Canvas 尺寸
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // 游戏状态
        const STATE = {
            MENU: 0,
            PLAYING: 1,
            GAMEOVER: 2
        };
        let currentState = STATE.MENU;
        let score = 0;
        let animationId;

        // 玩家
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 15,
            color: 'white',
            speed: 5,
            angle: 0
        };

        // 游戏对象
        let bullets = [];
        let enemies = [];
        let particles = []; // 简单的爆炸粒子

        // 输入状态
        const keys = {
            w: false,
            a: false,
            s: false,
            d: false
        };
        const mouse = { x: canvas.width / 2, y: canvas.height / 2 };

        // 监听键盘
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = true;
            if (e.key === 'a' || e.key === 'A') keys.a = true;
            if (e.key === 's' || e.key === 'S') keys.s = true;
            if (e.key === 'd' || e.key === 'D') keys.d = true;
            
            if (currentState === STATE.GAMEOVER && e.code === 'Space') {
                resetGame();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = false;
            if (e.key === 'a' || e.key === 'A') keys.a = false;
            if (e.key === 's' || e.key === 'S') keys.s = false;
            if (e.key === 'd' || e.key === 'D') keys.d = false;
        });

        // 监听鼠标
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mousedown', () => {
            if (currentState === STATE.MENU) {
                resetGame();
            } else if (currentState === STATE.PLAYING) {
                shoot();
            }
        });

        function resetGame() {
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            bullets = [];
            enemies = [];
            particles = [];
            score = 0;
            scoreEl.innerText = 'Score: 0';
            currentState = STATE.PLAYING;
            
            // 清除旧的定时器
            if (window.spawnInterval) clearInterval(window.spawnInterval);
            startSpawning();
        }

        function shoot() {
            const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
            const velocity = {
                x: Math.cos(angle) * 10,
                y: Math.sin(angle) * 10
            };
            bullets.push({
                x: player.x,
                y: player.y,
                radius: 5,
                color: 'yellow',
                velocity: velocity
            });
        }

        function startSpawning() {
            window.spawnInterval = setInterval(() => {
                if (currentState !== STATE.PLAYING) return;

                const radius = 20 + Math.random() * 20; // 随机大小
                let x, y;

                // 随机从屏幕边缘生成
                if (Math.random() < 0.5) {
                    x = Math.random() < 0.5 ? 0 - radius : canvas.width + radius;
                    y = Math.random() * canvas.height;
                } else {
                    x = Math.random() * canvas.width;
                    y = Math.random() < 0.5 ? 0 - radius : canvas.height + radius;
                }

                const color = `hsl(${Math.random() * 360}, 50%, 50%)`;
                const angle = Math.atan2(player.y - y, player.x - x);
                const velocity = {
                    x: Math.cos(angle), // 基础速度
                    y: Math.sin(angle)
                };

                enemies.push({
                    x, y, radius, color, velocity,
                    speed: 1 + Math.random() // 随机速度
                });
            }, 1000);
        }

        function update() {
            if (currentState !== STATE.PLAYING) return;

            // 玩家移动
            if (keys.w) player.y -= player.speed;
            if (keys.s) player.y += player.speed;
            if (keys.a) player.x -= player.speed;
            if (keys.d) player.x += player.speed;

            // 限制玩家在屏幕内
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

            // 更新子弹
            bullets.forEach((bullet, index) => {
                bullet.x += bullet.velocity.x;
                bullet.y += bullet.velocity.y;

                // 移除屏幕外的子弹
                if (bullet.x < 0 || bullet.x > canvas.width || bullet.y < 0 || bullet.y > canvas.height) {
                    setTimeout(() => bullets.splice(index, 1), 0);
                }
            });

            // 更新敌人
            enemies.forEach((enemy, index) => {
                // 追踪玩家
                const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
                enemy.velocity.x = Math.cos(angle) * enemy.speed;
                enemy.velocity.y = Math.sin(angle) * enemy.speed;
                
                enemy.x += enemy.velocity.x;
                enemy.y += enemy.velocity.y;

                // 玩家与敌人碰撞检测 (距离检测)
                const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                if (dist - enemy.radius - player.radius < 1) {
                    currentState = STATE.GAMEOVER;
                }

                // 子弹与敌人碰撞检测
                bullets.forEach((bullet, bIndex) => {
                    const dist = Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y);
                    
                    if (dist - enemy.radius - bullet.radius < 1) {
                        // 创建爆炸粒子
                        for (let i = 0; i < 8; i++) {
                            particles.push({
                                x: bullet.x,
                                y: bullet.y,
                                radius: Math.random() * 3,
                                color: enemy.color,
                                velocity: {
                                    x: (Math.random() - 0.5) * 8,
                                    y: (Math.random() - 0.5) * 8
                                },
                                alpha: 1
                            });
                        }

                        // 缩小敌人或销毁
                        if (enemy.radius > 15) {
                            // 大敌人被打中变小
                            // gsap.to(enemy, {radius: enemy.radius - 10}); // 如果有GSAP库的话，这里简单处理
                            enemy.radius -= 10;
                            setTimeout(() => bullets.splice(bIndex, 1), 0);
                            score += 5;
                        } else {
                            setTimeout(() => {
                                enemies.splice(index, 1);
                                bullets.splice(bIndex, 1);
                            }, 0);
                            score += 10;
                        }
                        scoreEl.innerText = `Score: ${score}`;
                    }
                });
            });

            // 更新粒子
            particles.forEach((particle, index) => {
                if (particle.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    particle.velocity.x *= 0.95; // 摩擦力
                    particle.velocity.y *= 0.95;
                    particle.x += particle.velocity.x;
                    particle.y += particle.velocity.y;
                    particle.alpha -= 0.02;
                }
            });
        }

        function draw() {
            animationId = requestAnimationFrame(draw);
            update(); // 每帧更新逻辑

            // 绘制背景 (带拖尾效果)
            ctx.fillStyle = 'rgba(30, 30, 30, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制玩家
            // 计算玩家角度 (面向鼠标)
            const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
            
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(angle);
            
            // 身体
            ctx.beginPath();
            ctx.arc(0, 0, player.radius, 0, Math.PI * 2, false);
            ctx.fillStyle = player.color;
            ctx.fill();

            // 枪口
            ctx.fillStyle = 'red';
            ctx.fillRect(10, -5, 20, 10); // 长方形枪口
            
            ctx.restore();

            // 绘制子弹
            bullets.forEach(bullet => {
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = bullet.color;
                ctx.fill();
            });

            // 绘制敌人
            enemies.forEach(enemy => {
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = enemy.color;
                ctx.fill();
            });

            // 绘制粒子
            particles.forEach(particle => {
                ctx.save();
                ctx.globalAlpha = particle.alpha;
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = particle.color;
                ctx.fill();
                ctx.restore();
            });

            // UI 绘制
            if (currentState === STATE.MENU) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = 'white';
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('CLICK TO START', canvas.width / 2, canvas.height / 2);
            }

            if (currentState === STATE.GAMEOVER) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = 'red';
                ctx.font = '50px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
                
                ctx.fillStyle = 'white';
                ctx.font = '20px Arial';
                ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 50);
                ctx.fillText('Press SPACE to Restart', canvas.width / 2, canvas.height / 2 + 90);
            }
        }

        // 启动
        draw();
    </script>
</body>
</html>
