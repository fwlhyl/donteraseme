<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人物动作小样</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3eb;color:#282d25;font:15px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:32px 24px}h1{font-size:25px;margin:0 0 6px}p{color:#687160;margin:0 0 20px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button{font:inherit;border:1px solid #a2aa96;background:transparent;color:#30392c;padding:7px 16px;cursor:pointer}button[aria-pressed=true]{background:#30392c;color:#faf9f5}label{display:flex;align-items:center;gap:8px;margin-left:10px}select{font:inherit;padding:6px;border:1px solid #a2aa96;background:#faf9f5;color:#30392c}.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}.panel{background:#eeeee6;border:1px solid #c9cdbf;padding:16px}.panel span{color:#687160;font-size:13px}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}small{display:block;color:#687160;margin-top:14px}@media(max-width:700px){.panels{grid-template-columns:1fr}}
</style></head><body><main><h1>人物 · 动作小样</h1><p>观察待机与行走；画面使用游戏中的人物和武器绘制代码。</p><div class="controls" aria-label="动作"><button data-action="idle" aria-pressed="true">待机 Idle</button><button data-action="walk" aria-pressed="false">行走 Walk</button><button id="shot">射击</button><button id="reload">换弹</button><button id="hit">受击</button><button id="defeat">死亡</button><button id="victory">胜利</button><button id="pause">暂停</button><label>角色 <select id="character"></select></label><label>武器 <select id="weapon"></select></label><label>移动方向 <select id="direction"><option value="1">向右</option><option value="-1">向左</option></select></label><label>武器瞄准 <input id="aim" type="range" min="-180" max="180" value="0" step="1"><output id="aim-value">0°</output></label></div><div class="panels"><div class="panel"><span>4 倍放大 · 查看动作细节</span><canvas id="large" width="500" height="320"></canvas></div><div class="panel"><span>52 px · 游戏内实际尺寸</span><canvas id="native" width="500" height="320"></canvas></div></div><small>滑动瞄准角度可观察前进与倒退持枪，切换动作时会显示过渡。</small></main><script type="module" src="./review.ts"></script></body></html>
