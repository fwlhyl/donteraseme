<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>怪物设计小样</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3eb;color:#282d25;font:15px/1.6 system-ui,sans-serif}main{max-width:1150px;margin:auto;padding:30px 24px}h1{font-size:25px;margin:0}p{color:#687160}button{font:inherit;border:1px solid #a2aa96;background:transparent;color:#30392c;padding:7px 16px;cursor:pointer;margin-right:8px}button[aria-pressed=true]{background:#30392c;color:#faf9f5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.panel{background:#eeeee6;border:1px solid #c9cdbf;padding:16px}h2{font-size:19px;margin:0}small{color:#687160}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:#faf9f5;margin-top:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><main><h1>怪物设计小样</h1><p>查看常规敌人的外形和动作。每张画布左侧为放大比较，右侧为游戏尺寸参考；收藏家作为比例参照。</p><p><a href="../boss-concept-review/index.html">查看四个 Boss 形象小样</a></p><div><button id="motion" aria-pressed="true">行走</button><button id="background" aria-pressed="false">切换到彩色笔迹背景</button></div><div class="grid"><section class="panel"><h2>追逐者</h2><small>常见的小型追击敌人</small><canvas id="chaser" width="540" height="280"></canvas></section><section class="panel"><h2>橡皮擦</h2><small>会擦除画作的敌人</small><canvas id="eraser" width="540" height="280"></canvas></section><section class="panel"><h2>持盾怪</h2><small>防御与逼近</small><canvas id="shield" width="540" height="280"></canvas></section><section class="panel"><h2>远程射手</h2><small>保持距离攻击</small><canvas id="shooter" width="540" height="280"></canvas></section><section class="panel"><h2>召唤母体</h2><small>召唤小怪</small><canvas id="summoner" width="540" height="280"></canvas></section><section class="panel"><h2>纸飞机</h2><small>高速飞行</small><canvas id="plane" width="540" height="280"></canvas></section></div><p>这些常规怪物已接入游戏，预览与对局使用相同绘制代码。</p></main><script type="module" src="./review.ts"></script></body></html>
