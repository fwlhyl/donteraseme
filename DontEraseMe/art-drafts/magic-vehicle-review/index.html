<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>画笔成真 · 载具动作</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f1e9;color:#292b25;font:15px/1.6 system-ui,sans-serif}main{max-width:1160px;margin:auto;padding:28px 24px}h1{font-size:26px;margin:0}p,small{color:#686b61}p{margin:6px 0 18px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}button{font:inherit;padding:8px 18px;border:1px solid #95988b;color:#292b25;background:transparent;cursor:pointer}button[aria-pressed=true]{background:#30352d;color:#f8f7ef}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{padding:15px;background:#e9e9e1;border:1px solid #cccfc2}h2{font-size:18px;margin:0}.card canvas{display:block;width:100%;height:auto;margin-top:10px;image-rendering:pixelated;background:#faf9f4}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body><main><h1>画笔成真 · 载具动作小样</h1><p>三个载具展示与收藏家的比例；左侧放大，右侧模拟游戏尺寸。切换动作与朝向查看效果。</p><div class="controls" aria-label="动作控制"><button id="idle" aria-pressed="false">待机</button><button id="move" aria-pressed="true">移动</button><button id="attack" aria-pressed="false">攻击</button><button id="flip" aria-pressed="false">切换朝向</button></div><div class="controls"><label for="aim">坦克炮筒 / 机器人手臂瞄准：<output id="aim-value" for="aim">0°</output>　下 <input id="aim" type="range" min="-35" max="35" step="1" value="0"> 上</label></div><div class="grid"><section class="card"><h2>坦克</h2><small>履带行驶 · 炮塔后坐力</small><canvas id="tank" width="720" height="300"></canvas></section><section class="card"><h2>机器人</h2><small>交替迈步 · 出拳</small><canvas id="robot" width="720" height="300"></canvas></section><section class="card"><h2>轰炸机</h2><small>悬浮推进 · 投弹</small><canvas id="bomber" width="720" height="300"></canvas></section></div><p>滑块展示坦克和机器人的俯仰范围，左右切换时身体和武器一同转向；轰炸机不受滑块影响。</p></main><script type="module" src="./review.ts"></script></body></html>
