<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夜间速写街区 · 场景与角色联合审阅</title>
<link rel="stylesheet" href="../src/style.css"><link rel="stylesheet" href="../src/ui/combatHud.css">
<style>
html,body{overflow:auto!important;height:auto!important;margin:0;background:#192332!important;color:#eae4d6!important;font:14px/1.65 system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:26px}h1{font-size:27px;margin:0 0 8px}h2{font-size:18px;margin:0 0 10px}p{margin:4px 0;color:#b8c6d3}.tools{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:20px 0 14px}.tools button{position:static;padding:7px 14px;font:inherit;border:1px solid #a99b7c;background:#efe6d2;color:#252e39;cursor:pointer;border-radius:4px;box-shadow:none}.tools button[aria-pressed=true]{background:#d7b25e}.tools label{margin-left:10px;cursor:pointer}.stage{position:relative;height:620px;overflow:hidden;border:1px solid #65727b;border-radius:6px;background:#27394d;isolation:isolate}.stage #scene{display:block;position:absolute;inset:0;width:100%;height:100%;z-index:0}.stage #ui{position:absolute;display:flex;flex-direction:column;pointer-events:none;z-index:2}.stage-caption{padding:10px 0 20px}.below{display:grid;grid-template-columns:minmax(0,3fr) minmax(210px,1fr);gap:22px}.overview{position:relative}.overview #overview{display:block;position:static;width:100%;height:auto;aspect-ratio:3/2}.character{padding:18px;background:#28374b;border:1px solid #536273;border-radius:6px}.character img{width:100%;display:block;max-width:220px;margin:auto}.character p{font-size:12px}.fine{font-size:12px;color:#aebdca;margin:16px 0}.eyebrow{font-size:12px;letter-spacing:.12em;color:#d7b25e}@media(max-width:720px){main{padding:14px}.stage{height:530px}.below{grid-template-columns:1fr}.tools label{margin-left:0}}
</style></head><body><main>
<header><div class="eyebrow">DONT ERASE ME / PEN & WASH / REVIEW 04</div><h1>同一条夜街，同一种笔触。</h1><p>场景＋角色联合候选 · 64 px 角色显示框 · UI 沿用现有组件</p></header>
<div class="tools"><button id="new" aria-pressed="true">新方案：速写淡彩</button><button id="old" aria-pressed="false">对照：当前游戏素材</button><button id="camera">查看中央画板</button><label><input id="boundary" type="checkbox"> 显示现有碰撞边界</label><label><input id="paint" type="checkbox"> 颜料可读性样线</label></div>
<div class="stage"><canvas id="scene" aria-label="场景与角色同屏静态效果稿"></canvas><div id="ui"><div id="health"></div><div id="weapon"></div><div class="hud-score">得分 0 · 金币 0 · 评级 0</div><div class="hud-magic">G · 神笔 0/45</div></div></div>
<p class="stage-caption" id="status" role="status">素材加载中…</p>
<div class="below"><section><h2>全图与边界核对</h2><div class="overview"><canvas id="overview" aria-label="完整地图与既有边界对照"></canvas></div></section><section class="character"><h2>角色局部放大</h2><img id="portrait" alt="细墨线与淡彩墨团收藏家"><p>放大图仅用于看线条；上方场景才是 64 px 显示框。脚底使用独立小阴影示意接地，不写入人物原图。</p></section></div>
<p class="fine">这是独立美术审阅页，不是运行中的对局；没有敌人、伤害或存档写入。生命／武器卡直接复用现有 UI 组件与样式。候选尚未替换运行资源，碰撞线沿用原始数据，不代表新图边缘已经逐段通过实机碰撞验收。</p>
</main><script type="module" src="./sketch-wash-review.ts"></script></body></html>
